<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어린이집지도팀 · 우리 팀 일정</title>
<style>
:root{
  --cream:#FFF8EC;
  --paper:#FFFFFF;
  --ink:#4A3F36;
  --ink-soft:#8A7D70;
  --line:#F0E3D0;
  --line-soft:#F8F0E3;
  --accent:#FFD25E;
  --accent-bd:#F2B93B;
  --accent-soft:#FFF1C9;
  --accent-ink:#7A4E00;
  --red:#E5566D;
  --red-deep:#C0334C;
  --sat:#4C8DF0;
  --rest:#FCFAFE;      /* 쉬는 날(주말·공휴일) 음영: 옅은 보라 — 팀 색(회색·파랑·분홍·초록)과 겹치지 않아요 */
  --rest-hol:#F5F0FB;
  --shadow:0 1px 0 rgba(120,90,50,.04),0 8px 24px rgba(120,90,50,.07);
  --font:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Nanum Gothic",system-ui,sans-serif;
}
/* 화면 테마: 팀원 색(파랑·분홍·초록)과 점검 상태 색(초록·주황·빨강)은 테마와 상관없이 그대로 둬요. */
:root[data-theme="office"]{
  --cream:#F3F4F7; --paper:#FFFFFF; --ink:#2B3140; --ink-soft:#6B7280;
  --line:#E1E4EA; --line-soft:#EDEFF3;
  --accent:#5B7CFA; --accent-bd:#3E5FE0; --accent-soft:#E8ECFF; --accent-ink:#1E3A8A;
  --rest:#F6F7FA; --rest-hol:#EEF0F6;
}
:root[data-theme="vibrant"]{
  --cream:#FFF5F1; --paper:#FFFFFF; --ink:#4A3F36; --ink-soft:#8F7E71;
  --line:#FBDFD1; --line-soft:#FFEEE6;
  --accent:#FF9E78; --accent-bd:#F17847; --accent-soft:#FFE3D6; --accent-ink:#8A3B1E;
  --rest:#F5FCF9; --rest-hol:#ECF9F2;
}
/* 사람별 색: 은나=파랑, 수현=분홍, 건우=초록, 지도팀 전체=회색 */
.tone-team{--bg:#EEEBE6;--tint:#F8F6F3;--ink2:#5E554C;--bd:#D9D3CA;--solid:#A79D92;--tag:#8E857B}
.tone-enna{--bg:#E1EDFD;--tint:#F1F7FF;--ink2:#2A5DA8;--bd:#C3D9F6;--solid:#5B9BF0;--tag:#4A8BE8}
.tone-suhyeon{--bg:#FDE6EC;--tint:#FFF3F6;--ink2:#B23A5C;--bd:#F7CBD7;--solid:#F28BA6;--tag:#E5708C}
.tone-geonu{--bg:#E0F3E4;--tint:#F1FAF3;--ink2:#2C7A48;--bd:#C3E6CB;--solid:#6CC08A;--tag:#4FAE71}

*{box-sizing:border-box}
html,body{margin:0}
html{scrollbar-gutter:stable}
body{background-color:var(--cream);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #E0A020;outline-offset:2px}
svg{display:block}

/* ---------- 머리말 ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px 4px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px;min-width:0;color:inherit;text-decoration:none;border-radius:18px;padding:2px 12px 2px 2px;cursor:pointer}
.brand:hover{background:rgba(255,210,94,.2)}
.brand .logo{width:64px;height:64px;flex:none}
.brand h1{margin:0;font-size:32px;line-height:1.15;letter-spacing:-.025em;font-weight:800;display:flex;align-items:center;gap:8px}
.brand h1 svg.heart{width:26px;height:24px}
.brand p{margin:3px 0 0;color:var(--ink-soft);font-size:14px}
.top-right{display:flex;align-items:center;gap:16px}
.scene{width:300px;height:92px;flex:none}
.acct{display:flex;flex-direction:column;align-items:flex-end;gap:4px;color:var(--ink-soft);font-size:12.5px;font-weight:600}
.acct[hidden]{display:none}

/* ---------- 큰 틀 ---------- */
.shell{display:grid;grid-template-columns:158px minmax(0,1fr) 300px;gap:18px;padding:10px 24px 32px;align-items:start;max-width:1560px;margin:0 auto}
.nav{position:sticky;top:16px;display:flex;flex-direction:column;gap:6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:0;border-radius:14px;background:transparent;text-align:left;font-weight:600;color:var(--ink)}
.nav button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover:not([disabled]){background:rgba(242,185,59,.16)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.nav button[disabled]{color:#B5A899;cursor:default}
.nav .soon{display:block;font-size:11px;font-weight:600;color:#B5A899;line-height:1.2}
.nav-foot{margin-top:18px;padding:0 6px;color:var(--ink-soft);font-size:13px;line-height:1.6}
.nav-foot svg{width:100%;height:auto;margin-top:6px}

/* ---------- 도구줄 ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:600;white-space:nowrap}
.btn:hover{background:#FFFCF6;border-color:#E8D6BA}
.btn[disabled]{opacity:.6;cursor:default}
.btn.icon{width:40px;padding:0}
.btn.primary{background:var(--accent);border-color:var(--accent-bd);color:var(--ink);font-weight:700}
.btn.primary:hover{background:#FFC94A}
.btn.danger{background:#FFE9EC;border-color:#F3B5BF;color:#B23A4D;font-weight:700}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mt{display:flex;align-items:center;gap:6px}
.month-title{font-size:24px;font-weight:800;letter-spacing:-.02em;min-width:120px;text-align:center;margin:0;white-space:nowrap}
.spacer{flex:1}
.search{position:relative;flex:0 1 250px;min-width:180px}
.search input{width:100%;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--paper);padding:0 40px 0 16px}
.search input::placeholder{color:#B5A899}
.search svg{position:absolute;right:14px;top:12px;width:16px;height:16px;stroke:#B5A899;fill:none;stroke-width:2;stroke-linecap:round}

.notice{display:flex;align-items:center;gap:10px;margin-top:12px;padding:9px 16px;border-radius:16px;background:#FFF3CC;border:1.5px dashed #F2B93B;color:#6B4A00;font-size:13px;font-weight:600}
.notice[hidden]{display:none}

.frow{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;margin:14px 0 12px}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filters .lab{color:var(--ink-soft);font-size:13px;font-weight:600;margin-right:2px}
.fchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px 0 8px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:13px}
.fchip .av{width:20px;height:20px}
.fchip:hover{border-color:var(--bd,#E8D6BA)}
.fchip[aria-pressed="true"]{background:var(--bg);border-color:var(--solid);color:var(--ink2)}
.fchip.all{padding-left:14px}

/* ---------- 달력 ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
#view{overflow:hidden}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin:0 -1px -1px 0}
.dow{padding:10px 0;text-align:center;font-weight:700;font-size:13px;background:#FBF6EC;border-bottom:1px solid var(--line)}
.dow.sun{color:var(--red-deep)}
.dow.sat{color:#2F6FD0}
.day{min-height:124px;padding:6px 6px 8px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);cursor:pointer;min-width:0;position:relative}
.day.off{background:#FFFDF9;cursor:default}
.day.rest{background:var(--rest)}
.day:not(.off):hover{background:#FFFAEB}
.day.sel{background:#FFF8DF;box-shadow:inset 0 0 0 2px var(--accent-bd)}
.dnum-row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:4px;min-height:24px}
.dnum{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 4px;border-radius:999px;font-weight:700;font-size:13px}
.day.sunc .dnum,.day.hol .dnum{color:var(--red-deep)}
.day.satc:not(.hol) .dnum{color:#2F6FD0}
.day.today .dnum{background:#4A3F36;color:#fff!important}
.hol-name{font-size:11px;font-weight:700;color:var(--red-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-direction:column;gap:3px}
.chip{display:flex;align-items:flex-start;gap:5px;width:100%;min-width:0;padding:4px 7px 4px 4px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--ink2);font-size:12px;font-weight:600;line-height:1.3;text-align:left}
.chip:hover{border-color:var(--solid)}
.chip .avs{display:inline-flex;flex:none;margin-top:1px}
.chip .av{width:18px;height:18px}
.chip .av+.av{margin-left:-6px}
.chip .t{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.more{align-self:flex-start;border:0;background:transparent;color:var(--ink-soft);font-size:12px;font-weight:600;padding:1px 4px}
.more:hover{color:var(--ink)}
.av{display:inline-flex}
.av svg{width:100%;height:100%}

/* ---------- 오른쪽 상세 ---------- */
.panel{position:sticky;top:16px;padding:18px 16px 16px;max-height:calc(100vh - 32px);overflow:auto}
.panel h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel .hol-badge{font-size:12px;font-weight:700;color:var(--red-deep);background:#EFE7F9;border-radius:999px;padding:1px 9px}
.panel .sub{margin:2px 0 12px;color:var(--ink-soft);font-size:13px}
.cards{display:flex;flex-direction:column;gap:10px}
.ecard{border:1px solid var(--bd);border-left:5px solid var(--solid);background:var(--tint);border-radius:14px;padding:11px 13px 12px;box-sizing:border-box;min-width:0;max-width:100%}
.ecard.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--bd)}100%{box-shadow:0 0 0 0 transparent}}
.ehead{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.tag{display:inline-block;white-space:nowrap;padding:1px 9px;border-radius:999px;background:var(--tag);color:#fff;font-size:12px;font-weight:700}
.etime{font-size:12px;color:var(--ink-soft);font-weight:600}
.eact{display:flex;justify-content:flex-end;gap:6px;margin-top:9px}
.eact button{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:0 10px;height:24px;font-size:12px;font-weight:700;color:var(--ink2)}
.eact button:hover{background:var(--bg)}
.ecard h3{margin:0 0 6px;font-size:15px;font-weight:800;line-height:1.35}
dl.info{margin:0;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 8px;font-size:13px}
dl.info dt{color:var(--ink-soft);font-weight:600}
dl.info dd{margin:0;word-break:keep-all;overflow-wrap:anywhere}
dl.info .who{display:flex;align-items:center;gap:6px}
dl.info .who>span:last-child{min-width:0}
dl.info .who .avs2{display:inline-flex;flex:none}
dl.info .who .av{width:18px;height:18px}
.empty{padding:14px 8px 4px;text-align:center;color:var(--ink-soft)}
.empty svg{width:64px;height:66px;margin:0 auto 6px}
mark{background:#FFE58A;color:inherit;border-radius:4px;padding:0 2px}
.searchwrap{display:flex;align-items:center;gap:8px}
.hitnav{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.hitnav[hidden]{display:none}
.hitnav .btn{width:30px;height:30px;padding:0}
.chip.hit{border-color:var(--accent-bd);box-shadow:0 0 0 2px var(--accent-bd)}
.ecard.hit{box-shadow:0 0 0 2px var(--accent-bd)}
.res{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);text-align:left;color:var(--ink2)}
.res .d{flex:none;font-weight:800;font-size:13px;min-width:70px}
.res .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 일정 목록 ---------- */
.list{padding:8px 18px 20px}
.listhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.listhead h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.listhead .sum{flex:1;color:var(--ink-soft);font-size:13px;font-weight:600}
.listscroll{position:relative;max-height:calc(100vh - 235px);min-height:340px;overflow:auto;padding:0 18px 14px}
.lmhead{position:sticky;top:0;z-index:3;background:#fff;padding:10px 2px 8px;font-size:14px;font-weight:800;color:var(--ink-soft);border-bottom:2px solid var(--line)}
.lgroup.today{background:#FFF8DF;box-shadow:inset 0 0 0 2px var(--accent-bd);border-radius:16px;padding:12px 14px 6px;margin:8px -8px;border-bottom:0}
.lgroup{padding:14px 0 4px;border-bottom:1px dashed var(--line)}
.lgroup:last-child{border-bottom:0}
.lgroup h3{margin:0 0 8px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.lgroup h3 .todaytag{font-size:11px;background:#4A3F36;color:#fff;border-radius:999px;padding:0 8px}
.lgroup .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));margin-bottom:10px}
.lgroup.rest h3{color:var(--red-deep)}

/* ---------- 아래 안내 ---------- */
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 4px 0;color:var(--ink-soft);font-size:12.5px}

/* ---------- 말풍선 ---------- */
#tip{position:fixed;z-index:60;max-width:330px;min-width:240px;background:#fff;border:1px solid var(--bd);border-left:5px solid var(--solid);border-radius:14px;padding:11px 13px 12px;box-shadow:0 12px 32px rgba(80,55,20,.2);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}

/* ---------- 창/알림 ---------- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(74,63,54,.38);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.on{display:flex}
.dialog{width:min(580px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:22px;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(60,40,10,.3)}
.dialog h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.dialog .lead{margin:0 0 14px;color:var(--ink-soft);font-size:13px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:12px;padding:8px 11px;background:#FFFDF9;font-weight:500;color:var(--ink)}
.form textarea{resize:vertical;min-height:60px}
.form .hint{font-size:12px;font-weight:500;color:var(--ink-soft);margin-top:2px}
.checks{display:flex;gap:14px;flex-wrap:wrap;padding:6px 2px 0}
.checks label{flex-direction:row;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
.checks input{accent-color:#E0A020}
.err{min-height:18px;margin-top:8px;color:#C23A4D;font-size:13px;font-weight:700}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);z-index:120;background:#4A3F36;color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fatal{margin:40px auto;max-width:520px;text-align:center;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px}

/* ---------- 로그인 ---------- */
.login{position:fixed;inset:0;z-index:100;background-color:var(--cream);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.login[hidden]{display:none}
.login-card{width:min(400px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:22px 24px 26px;display:flex;flex-direction:column;gap:12px;text-align:center}
.login-card .scene{width:100%;height:auto}
.login-card h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.login-card p{margin:0 0 4px;color:var(--ink-soft)}
.login-card label{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.login-card input{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#FFFDF9;font-weight:500}
.login-card .err{margin:0;text-align:left}

/* ---------- 화면이 좁을 때 ---------- */
@media (max-width:1180px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px;padding:8px 18px 28px}
  .nav{position:static;flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto;padding:9px 14px}
  .nav-foot{display:none}
  .panel{position:static;max-height:none}
  .top{padding:14px 18px 2px}
  .scene{width:230px;height:70px}
}
@media (max-width:760px){
  .top-right .scene{display:none}
  .brand h1{font-size:25px}
  .brand .logo{width:48px;height:48px}
  .month-title{font-size:20px;min-width:126px}
  .toolbar{gap:6px}
  .btn.icon{width:36px}
  #today{padding:0 11px}
  .searchwrap{flex:1 1 100%}
  .search{flex:1 1 auto}
  .spacer{display:none}
  .btn .lbl{display:none}
  .btn{padding:0 13px}
  .btn.sm{padding:0 12px}
  .day{min-height:66px;padding:4px 3px 6px}
  .dnum{min-width:22px;height:22px;font-size:12px}
  .hol-name{display:none}
  .chips{flex-direction:row;flex-wrap:wrap;gap:3px;padding:0 2px}
  .chip{width:11px;height:11px;padding:0;border-radius:50%;background:var(--solid);border:0}
  .chip .av,.chip .t{display:none}
  .more{display:none}
  .login-card .scene{display:block}
  /* 달을 넘기는 버튼이 스크롤해도 계속 위에 붙어있어서, 한 달을 다 보려고 스크롤을 내려도
     매번 위로 올라가 화살표를 누를 필요가 없어요. */
  .toolbar{position:sticky;top:0;z-index:15;background:var(--cream);padding:8px 0;margin:0 -2px;padding-left:2px;padding-right:2px}
  /* 팝업창(일정 추가·수정)은 2칸이던 항목을 한 줄씩 세로로 쌓아서, 좌우로 스크롤할 필요가 없게 해요 */
  .dialog{padding:18px 16px 16px}
  .form{grid-template-columns:1fr}
  /* 아이폰 사파리 등에서는 글자 크기가 16px보다 작은 입력칸을 누르면 화면이 저절로 확대돼요.
     그걸 막으려고 모바일에서는 입력칸 글자를 16px로 살짝 키웠어요. */
  .form input,.form select,.form textarea,.search input,.dctools input,.dctools select,.login-card input{font-size:16px}
  /* 손가락으로 누르기 편하도록 작은 버튼들의 탭 영역을 넉넉하게 키웠어요 */
  .eact button{height:32px;padding:0 13px;font-size:13px}
  .dcacts{flex-direction:column;gap:4px}
  .dcacts button{height:32px;padding:0 12px;font-size:12.5px}
  .checks label{padding:5px 2px}
  .checks input{width:18px;height:18px}
}

/* ---------- 어린이집 목록 ---------- */
@media (min-width:1181px){.shell.wide{grid-template-columns:158px minmax(0,1fr)}}
.shell.wide .panel{display:none}
#dcview{display:flex;flex-direction:column;gap:16px}

.orow .lbl{font-weight:700;font-size:13.5px;flex:1;color:var(--ink)}

.persactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}

.exportgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .pick{width:100%}

function pad(n){ return String(n).padStart(2,'0'); }
function ymd(y,m,d){ return y+'-'+pad(m)+'-'+pad(d); }
function parseKey(k){ var p=k.split('-'); return { y:+p[0], m:+p[1], d:+p[2] }; }
function weekOf(k){ var p=parseKey(k); return new Date(p.y,p.m-1,p.d).getDay(); }
function niceDate(k){ var p=parseKey(k); return p.m+'월 '+p.d+'일 ('+WEEK[weekOf(k)]+')'; }
function todayKey(){ var d=new Date(); return ymd(d.getFullYear(),d.getMonth()+1,d.getDate()); }
function isRest(k){ var w=weekOf(k); return w===0||w===6||!!HOLIDAYS[k]; }
function dateLabel(k,withYear){ var p=parseKey(k); return (withYear?p.y+'. ':'')+p.m+'. '+p.d+'.('+WEEK[weekOf(k)]+')'; }
function rangeDates(a,b){
  var out=[], pa=parseKey(a), pb=parseKey(b), d=new Date(pa.y,pa.m-1,pa.d), e=new Date(pb.y,pb.m-1,pb.d), n=0;
  while(d<=e && n<400){ out.push(ymd(d.getFullYear(),d.getMonth()+1,d.getDate())); d.setDate(d.getDate()+1); n++; }
  return out;
}

/* ================== 일정 계산 ================== */
function categorize(title, hasWho){
  if(/지도점검/.test(title)) return '점검';
  if(/대체휴무|연가|휴가|병가|공가/.test(title)) return '휴가';
  if(/일직|숙직|당직/.test(title)) return '당직';
  if(/교육|연수|워크숍/.test(title)) return '교육';
  if(/인사이동|인사발령|정기인사|전보|발령/.test(title)) return '인사';
  if(/출장/.test(title) || hasWho) return '출장';
  return '기타';
}
function timeLabel(cat, when){
  if(cat==='당직'||cat==='휴가') return '';
  var s=when||'';
  var m=s.match(/(\d{1,2}:\d{2})\s*\/\s*(\d{1,2}:\d{2})/);
  if(m) return m[1]+'·'+m[2];
  var t=s.match(/\d{1,2}:\d{2}/);
  return t?t[0]:'';
}
function startMinutes(label){
  var t=(label||'').match(/(\d{1,2}):(\d{2})/);
  return t? (+t[1])*60+(+t[2]) : 24*60+1;
}
// 저장된 값(제목·칸·출장자·일시…)에서 화면에 필요한 값들을 계산해 채워요
function finalize(e){
  e.people = e.people || [];
  e.isAll = (e.people.length === NAMES.length);
  e.tone = e.col===TEAM ? 'team' : (TONE_OF[e.col]||'team');
  e.cat = categorize(e.title, e.hasWho);
  e.time = timeLabel(e.cat, e.when);
  e.mins = startMinutes(e.time);
  return e;
}
function sortEvents(){
  state.events.sort(function(x,y){ return x.dates[0]<y.dates[0]?-1:x.dates[0]>y.dates[0]?1:x.mins-y.mins; });
}
function signature(list){
  return JSON.stringify(list.map(function(e){ return [e.id,e.title,e.col,e.people,!!e.hasWho,e.when,e.place,e.content,e.dates]; }).sort());
}
function setEvents(list){
  state.events=list.map(function(e){
    return finalize({ id:e.id, title:e.title, col:e.col, people:e.people, hasWho:!!e.hasWho, when:e.when||'', place:e.place||'', content:e.content||'', dates:(e.dates||[]).slice().sort() });
  }).filter(function(e){ return e.dates.length; });
  byId={}; state.events.forEach(function(e){ byId[e.id]=e; });
  state.sig=signature(state.events);
  sortEvents();
}
function pickInitial(){
  state.selected=todayKey();
  var p=parseKey(state.selected); state.year=p.y; state.month=p.m-1;
}

function authError(){ var e=new Error('auth'); e.auth=true; return e; }
function demoStore(){
  var seq=1;
  return {
    mode:'demo',
    hasSession:function(){ return true; },
    session:function(){ return {email:''}; },
    logout:function(){},
    loadDaycares:function(){ return Promise.resolve(DEMO_DAYCARES||[]); },
    load:function(){ return Promise.resolve((DEMO_EVENTS||[]).map(function(e,i){ var c=JSON.parse(JSON.stringify(e)); c.id='d'+i; return c; })); },
    add:function(e){ var c=JSON.parse(JSON.stringify(e)); c.id='n'+(seq++); return Promise.resolve(c); },
    update:function(e){ return Promise.resolve(e); },
    remove:function(id){ return Promise.resolve(); }
  };
}
function onlineStore(){
  var S={ mode:'online', sess:null };
  function fromRow(r){ return { id:r.id, title:r.title, col:r.col, people:r.people||[], hasWho:!!r.has_who, when:r.when_text||'', place:r.place||'', content:r.content||'', dates:r.dates||[] }; }
  function toRow(e){ return { title:e.title, col:e.col, people:e.people, has_who:!!e.hasWho, when_text:e.when, place:e.place, content:e.content, dates:e.dates, updated_at:new Date().toISOString() }; }
  function saveSess(s){ S.sess=s; try{ if(s) localStorage.setItem('jt.session',JSON.stringify(s)); else localStorage.removeItem('jt.session'); }catch(e){} }
  function readSess(){ try{ return JSON.parse(localStorage.getItem('jt.session')||'null'); }catch(e){ return null; } }
  function mk(j, prev){ return { access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600), email:(j.user&&j.user.email)||(prev&&prev.email)||'' }; }
  function authCall(query, body){
    return fetch(SUPABASE_URL+'/auth/v1/token?'+query,{ method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { ok:r.ok, status:r.status, json:j }; }); });
  }
  S.hasSession=function(){ S.sess=readSess(); return !!(S.sess && S.sess.access_token); };
  S.session=function(){ return S.sess; };
  S.login=function(email,pw){
    return authCall('grant_type=password',{ email:email, password:pw }).then(function(r){
      if(!r.ok){ var e=new Error('login'); e.bad=(r.status===400||r.status===401||r.status===422); throw e; }
      saveSess(mk(r.json)); return S.sess;
    });
  };
  S.logout=function(){ saveSess(null); };
  function refresh(){
    if(!S.sess||!S.sess.refresh_token) return Promise.reject(authError());
    return authCall('grant_type=refresh_token',{ refresh_token:S.sess.refresh_token }).then(function(r){
      if(!r.ok){ saveSess(null); throw authError(); }
      saveSess(mk(r.json,S.sess));
    });
  }
  function fresh(){
    if(!S.sess) return Promise.reject(authError());
    if(S.sess.expires_at-60 < Date.now()/1000) return refresh();
    return Promise.resolve();
  }
  function rest(method, path, body, prefer){
    return fresh().then(function(){
      var h={ apikey:SUPABASE_KEY, Authorization:'Bearer '+S.sess.access_token, 'Content-Type':'application/json' };
      if(prefer) h.Prefer=prefer;
      return fetch(SUPABASE_URL+'/rest/v1/'+path,{ method:method, headers:h, body:body?JSON.stringify(body):undefined });
    }).then(function(r){
      if(r.status===401){ throw authError(); }
      if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP '+r.status+' '+t); });
      return r.status===204 ? null : r.json();
    });
  }
  S.loadDaycares=function(){
    return rest('GET','daycares?select=*').then(function(rows){ return (rows||[]).map(function(r){ return { name:r.name, type:r.type||'', dong:r.dong||'', phone:r.phone||'', address:r.address||'', lat:r.lat, lng:r.lng, inspectDate:r.inspect_date||null, closed:!!r.closed, closedNote:r.closed_note||'', alias:r.alias||[], approx:false, zip:r.zip||'', fax:r.fax||'', capacity:r.capacity, current:r.current_count, shuttle:r.shuttle||'', licensedDate:r.licensed_date||'' }; }); }).catch(function(e){ if(e && e.auth) throw e; return []; });
  };
  S.load=function(){ return rest('GET','events?select=*').then(function(rows){ return (rows||[]).map(fromRow); }); };
  S.add=function(e){ return rest('POST','events',toRow(e),'return=representation').then(function(rows){ if(!rows||!rows[0]) throw new Error('empty'); return fromRow(rows[0]); }); };
  S.update=function(e){ return rest('PATCH','events?id=eq.'+encodeURIComponent(e.id),toRow(e),'return=representation').then(function(rows){ if(!rows||!rows[0]){ var x=new Error('gone'); x.gone=true; throw x; } return fromRow(rows[0]); }); };
  S.remove=function(id){ return rest('DELETE','events?id=eq.'+encodeURIComponent(id),null,'return=representation').then(function(){ return null; }); };
  return S;
}

function errMsg(err){
  if(err && err.auth) return '로그인이 만료됐어요. 다시 로그인해 주세요.';
  if(err && err.gone) return '다른 사람이 이미 지운 일정이에요. 화면을 새로 불러올게요.';
  if(err && /Failed to fetch|NetworkError|Load failed|network/i.test(String(err.message))) return '인터넷에 연결되어 있는지 확인해 주세요.';
  return '저장하지 못했어요. 잠시 뒤에 다시 해 보세요.';
}

var WHO_LABEL={'점검':'출장자','출장':'출장자','교육':'참석자','당직':'근무자','휴가':'대상자','인사':'대상자','기타':'참석자'};
function searchTokens(){ return state.query.trim().toLowerCase().split(/\s+/).filter(Boolean); }
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
// 찾은 일정(e)의 글자에만 노란 표시를 해요
function hl(text,e){
  var toks=searchTokens();
  if(!toks.length || (e && !state.hitSet[e.id])) return esc(text);
  var re=new RegExp('('+toks.map(reEsc).join('|')+')','gi');
  return String(text==null?'':text).split(re).map(function(part,i){ return i%2 ? '<mark>'+esc(part)+'</mark>' : esc(part); }).join('');
}
// 사람 필터(전체·지도팀·은나…)만 일정을 걸러내요. 검색은 걸러내지 않고 '위치만' 옮겨요.
function visibleEvents(){
  var f=state.filter;
  return state.events.filter(function(e){
    if(f===TEAM && e.tone!=='team') return false;
    if(f!=='all' && f!==TEAM && e.people.indexOf(f)<0) return false;
    return true;
  });
}
// 팀 전체 > 은나 > 수현 > 건우 순으로 색이 뒤섞이지 않게 정렬할 때 쓰는 순서예요 (달력 화면 전용)
function colorRank(e){ var i=['team'].concat(NAMES).indexOf(e.tone==='team'?'team':e.col); return i<0?99:i; }
function groupByDate(list, calOrder){
  var m={};
  list.forEach(function(e){ e.dates.forEach(function(d){ (m[d]=m[d]||[]).push(e); }); });
  Object.keys(m).forEach(function(d){
    m[d].sort(calOrder
      ? function(a,b){ return colorRank(a)-colorRank(b) || a.mins-b.mins || (a.title<b.title?-1:1); }
      : function(a,b){ return a.mins-b.mins || (a.title<b.title?-1:1); }
    );
  });
  return m;
}
function matchesQuery(e,toks){
  var hay=(e.title+' '+e.place+' '+e.content+' '+e.people.join(' ')+' '+e.when+' '+e.cat).toLowerCase();
  for(var i=0;i<toks.length;i++){ if(hay.indexOf(toks[i])<0) return false; }
  return true;
}
function computeHits(){
  var toks=searchTokens();
  state.hits=[]; state.hitSet={};
  if(!toks.length){ state.hitIdx=-1; return; }
  visibleEvents().forEach(function(e){
    if(matchesQuery(e,toks)){ state.hitSet[e.id]=true; state.hits.push({ date:e.dates[0], id:e.id, mins:e.mins }); }
  });
  state.hits.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:a.mins-b.mins; });
  if(state.hitIdx>=state.hits.length) state.hitIdx=state.hits.length-1;
}
function dayDiff(a,b){ var pa=parseKey(a), pb=parseKey(b); return Math.round((new Date(pa.y,pa.m-1,pa.d)-new Date(pb.y,pb.m-1,pb.d))/86400000); }
function setHit(i){
  var n=state.hits.length; if(!n) return;
  state.hitIdx=((i%n)+n)%n;
  var h=state.hits[state.hitIdx];
  state.selected=h.date; var p=parseKey(h.date); state.year=p.y; state.month=p.m-1;
}
// 검색어를 입력하면, 지금 보는 달에서 가장 가까운 결과 위치로 달력이 넘어가요 (다른 일정은 그대로 보여요)
function jumpToMatch(){
  computeHits();
  if(!state.hits.length){ state.hitIdx=-1; return; }
  var ref=state.year+'-'+pad(state.month+1)+'-01', bi=0, bd=1e12;
  state.hits.forEach(function(h,i){ var df=Math.abs(dayDiff(h.date,ref)); if(df<bd || (df===bd && h.date>state.hits[bi].date)){ bi=i; bd=df; } });
  setHit(bi);
}
function afterHit(){
  var h=state.hits[state.hitIdx]; if(!h) return;
  var c=$('#panel .ecard[data-id="'+h.id+'"]'); if(c) c.classList.add('flash');
  if(state.view==='list'){ listCenterOn(h.date,true); }
  else if(window.innerWidth<=1180){ $('#view').scrollIntoView({behavior:'smooth',block:'start'}); }
}
function stepHit(d){
  computeHits(); if(!state.hits.length) return;
  setHit((state.hitIdx<0?(d>0?0:-1):state.hitIdx+d));
  renderAll(); afterHit();
}
function updateHitUi(){
  var q=state.query.trim(), n=state.hits.length;
  $('#hitnav').hidden=!q;
  if(q){
    $('#hitCount').textContent = n ? (state.hitIdx+1)+' / '+n : '결과 없음';
    $('#hitPrev').disabled=$('#hitNext').disabled=(n<2);
  }
}

function infoRows(e){
  var h='<dl class="info">';
  h+='<dt>'+(WHO_LABEL[e.cat]||'참석자')+'</dt><dd>'+whoHtml(e)+'</dd>';
  h+='<dt>일시</dt><dd>'+esc(e.when||'-')+'</dd>';
  if(e.place) h+='<dt>장소</dt><dd>'+hl(e.place,e)+'</dd>';
  if(e.content) h+='<dt>내용</dt><dd>'+hl(e.content,e)+'</dd>';
  return h+'</dl>';
}
function cardHtml(e, noActions){
  return '<article class="ecard tone-'+e.tone+(state.hitSet[e.id]?' hit':'')+'" data-id="'+esc(e.id)+'"><div class="ehead"><span class="tag">'+e.cat+'</span>'
    +(e.time?'<span class="etime">'+esc(e.time)+'</span>':'')
    +'</div><h3>'+hl(e.title,e)+'</h3>'+infoRows(e)
    +(noActions?'':'<div class="eact"><button type="button" data-act="edit" data-id="'+esc(e.id)+'">수정</button><button type="button" data-act="del" data-id="'+esc(e.id)+'">삭제</button></div>')+'</article>';
}
function chipAvatars(e){
  if(e.isAll) return houseAvatar();
  return e.people.slice(0,3).map(avatar).join('');
}

function renderFilters(){
  var items=[{k:'all',label:'전체',tone:'team',all:true},{k:TEAM,label:'지도팀',tone:'team',av:houseAvatar()}];
  NAMES.forEach(function(n){ items.push({k:n,label:n,tone:TONE_OF[n]||'team',av:avatar(n)}); });
  $('#filters').innerHTML='<span class="lab">보기</span>'+items.map(function(it){
    return '<button type="button" class="fchip tone-'+it.tone+(it.all?' all':'')+'" data-f="'+esc(it.k)+'" aria-pressed="'+(state.filter===it.k)+'">'+(it.av||'')+esc(it.label)+'</button>';
  }).join('');
}

function renderCalendar(){
  var y=state.year, m=state.month, first=new Date(y,m,1), lead=first.getDay(), days=new Date(y,m+1,0).getDate();
  var weeks=Math.ceil((lead+days)/7), trail=weeks*7-lead-days, by=groupByDate(visibleEvents(),true), t=todayKey(), MAX=3;
  var h='';
  h+='<div class="cal" role="grid">';
  WEEK.forEach(function(w,i){ h+='<div class="dow'+(i===0?' sun':i===6?' sat':'')+'" role="columnheader">'+w+'</div>'; });
  for(var i0=0;i0<lead;i0++) h+='<div class="day off"></div>';
  for(var d=1; d<=days; d++){
    var key=ymd(y,m+1,d), dow=(lead+d-1)%7, hol=HOLIDAYS[key], evs=by[key]||[];
    var cls='day'+(isRest(key)?' rest':'')+(dow===0?' sunc':'')+(dow===6?' satc':'')+(hol?' hol':'')+(key===t?' today':'')+(key===state.selected?' sel':'');
    h+='<div class="'+cls+'" data-date="'+key+'" role="gridcell"><div class="dnum-row"><span class="dnum">'+d+'</span>'+(hol?'<span class="hol-name">'+esc(hol)+'</span>':'')+'</div><div class="chips">';
    evs.slice(0,MAX).forEach(function(e){
      h+='<button type="button" class="chip tone-'+e.tone+(state.hitSet[e.id]?' hit':'')+'" data-id="'+esc(e.id)+'" data-date="'+key+'" aria-label="'+esc(e.title)+'"><span class="avs">'+chipAvatars(e)+'</span><span class="t">'+hl(e.title,e)+'</span></button>';
    });
    if(evs.length>MAX) h+='<button type="button" class="more" data-date="'+key+'">+'+(evs.length-MAX)+'개 더</button>';
    h+='</div></div>';
  }
  for(var i1=0;i1<trail;i1++) h+='<div class="day off"></div>';
  h+='</div>';
  $('#view').innerHTML=h;
}

function renderList(){
  var prev=$('#view .listscroll'), keepTop=prev?prev.scrollTop:null;
  var by=groupByDate(visibleEvents()), t=todayKey();
  var keys=Object.keys(by).sort();
  var h='<div class="listhead"><h2>일정 목록</h2><span class="sum"></span><button type="button" class="btn sm" id="listToday">오늘로 이동</button></div><div class="listscroll" id="listScroll">';
  var curMonth='';
  keys.forEach(function(k){
    var mk=k.slice(0,7);
    if(mk!==curMonth){
      if(curMonth) h+='</section>';
      curMonth=mk; var pp=parseKey(k);
      h+='<section class="lmon"><div class="lmhead">'+pp.y+'년 '+pp.m+'월</div>';
    }
    var evs=by[k]||[];
    var cls='lgroup'+(isRest(k)?' rest':'')+(k===t?' today':'');
    h+='<section class="'+cls+'" data-date="'+k+'"><h3>'+niceDate(k)+(HOLIDAYS[k]?' · '+esc(HOLIDAYS[k]):'')+(k===t?'<span class="todaytag">오늘</span>':'')+'</h3>'
      +'<div class="cards">'+evs.map(function(e){ return cardHtml(e,true); }).join('')+'</div></section>';
  });
  if(curMonth) h+='</section>';
  $('#view').innerHTML=h+'</div>';
  if(state.listCenter){ state.listCenter=false; listCenterOn(t,false); }
  else if(keepTop!==null){ var sc=$('#listScroll'); if(sc) sc.scrollTop=keepTop; }
}
// 원하는 날짜(없으면 그다음 날짜)의 일정을 목록 가운데로 옮겨요
function listCenterOn(k, smooth){
  var sc=$('#listScroll'); if(!sc) return;
  var g=sc.querySelector('.lgroup[data-date="'+k+'"]');
  if(!g){
    var all=sc.querySelectorAll('.lgroup');
    for(var i=0;i<all.length;i++){ if(all[i].getAttribute('data-date')>=k){ g=all[i]; break; } }
    if(!g && all.length) g=all[all.length-1];
  }
  if(!g) return;
  var top = g.offsetHeight>=sc.clientHeight ? g.offsetTop-10 : g.offsetTop-(sc.clientHeight-g.offsetHeight)/2;
  top=Math.max(0,top);
  sc.scrollTo({ top:top, behavior:(smooth && Math.abs(top-sc.scrollTop)<2500)?'smooth':'auto' });   // 아주 먼 곳은 바로 이동
}

function renderPanel(){
  var p=$('#panel');
  var k=state.selected, by=groupByDate(visibleEvents(),true), evs=by[k]||[];
  var head='<h2>'+niceDate(k)+(HOLIDAYS[k]?'<span class="hol-badge">'+esc(HOLIDAYS[k])+'</span>':'')+'</h2>';
  if(!evs.length){
    var msg = isRest(k) ? '쉬는 날이에요.' : '등록된 일정이 없는 날이에요.';
    p.innerHTML=head+'<p class="sub">'+msg+'</p><div class="empty"><svg viewBox="0 0 40 52" aria-hidden="true">'+bearBody()+bearFace()+'</svg></div>';
    return;
  }
  p.innerHTML=head+'<p class="sub">일정 '+evs.length+'건</p><div class="cards">'+evs.map(function(e){ return cardHtml(e); }).join('')+'</div>';
}

function monthInspectCount(y,m){
  var pre=y+'-'+pad(m+1)+'-', total=0;
  state.events.forEach(function(e){
    if(e.cat!=='점검') return;
    if(e.dates[0].indexOf(pre)!==0) return;
    var stripped=e.place.replace(/\([^)]*\)/g,'');
    stripped.split(',').forEach(function(x){ if(x.trim()) total++; });
  });
  return total;
}
function renderFoot(){
  if(state.view==='cal'){
    $('#foot').innerHTML='<span>'+(state.month+1)+'월 정기 지도점검 '+monthInspectCount(state.year,state.month)+'개소'+(Store.mode==='online'?' · 팀원 모두가 같은 일정을 봐요':'')+'</span>';
  } else {
    $('#foot').innerHTML='<span>일정 '+state.events.length+'건'+(Store.mode==='online'?' · 팀원 모두가 같은 일정을 봐요':'')+'</span>';
  }
}

function renderAll(){
  var isDc=(state.view==='dc'), isSet=(state.view==='settings'), isWide=isDc||isSet;
  document.querySelector('.shell').classList.toggle('wide',isWide);
  ['.toolbar','.frow','#view','#foot'].forEach(function(sel){ var el=document.querySelector(sel); if(el) el.style.display=isWide?'none':''; });
  $('#dcview').hidden=!isDc;
  $('#settingsview').hidden=!isSet;
  document.querySelectorAll('.nav [data-view]').forEach(function(b){ b.setAttribute('aria-current', b.getAttribute('data-view')===state.view?'page':'false'); });
  var nt=$('#notice'); if(nt && Store.mode==='demo') nt.hidden=isWide;
  if(isSet){ hideTip(); renderSettings(); return; }
  if(isDc){ hideTip(); renderDaycares(); return; }
  $('#monthTitle').textContent=state.year+'년 '+(state.month+1)+'월';
  $('#prev').disabled=(state.year===MIN_YEAR && state.month===MIN_MONTH);
  ['#prev','#next','#today','#mt','#addBtn'].forEach(function(s){ $(s).style.display = state.view==='cal' ? '' : 'none'; });
  computeHits(); updateHitUi();
  renderFilters();
  if(state.view==='cal') renderCalendar(); else renderList();
  renderPanel(); renderFoot(); hideTip();
}


/* ================== 어린이집 목록 · 지도 ================== */
var ST_LABEL={ done:'기점검', planned:'점검예정', none:'미점검', closed:'휴원·폐원' };
var DONG_ORDER=['대정읍','남원읍','성산읍','안덕면','표선면','송산동','정방동','중앙동','천지동','효돈동','영천동','동홍동','서홍동','대륜동','대천동','중문동','예래동'];
// 영유아보육법 제10조 각 호 순서예요 (6호 협동어린이집은 서귀포시에 없어서 뺐어요)
var TYPE_ORDER=['국공립','사회복지법인','법인·단체등','직장','가정','민간'];
function typeRank(t){ var i=TYPE_ORDER.indexOf(t); return i<0?999:i; }
function dongRank(d){ var i=DONG_ORDER.indexOf(d); return i<0?999:i; }
var ST_ORDER={ none:0, planned:1, done:2, closed:3 };
function dcKey(n){ return String(n||'').replace(/\s+/g,''); }
// 상태마다 모양과 색이 달라요: 기점검=초록빛 동그라미, 점검예정=주황 마름모, 미점검=빨간 네모
function stShape(st,px){
  var body={
    done:'<circle cx="12" cy="12" r="10" fill="#2FAE9F" stroke="#fff" stroke-width="2"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
    planned:'<path d="M12 1.6l10.4 10.4L12 22.4 1.6 12z" fill="#F5A03A" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.7" fill="#fff"/>',
    none:'<rect x="2.6" y="2.6" width="18.8" height="18.8" rx="4.5" fill="#E5555B" stroke="#fff" stroke-width="2"/><path d="M12 7v6.4" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="17" r="1.6" fill="#fff"/>',
    closed:'<circle cx="12" cy="12" r="10" fill="#B9B0A5" stroke="#fff" stroke-width="2"/><path d="M8 12h8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>'
  }[st]||'';
  return '<svg class="stshape" width="'+px+'" height="'+px+'" viewBox="0 0 24 24" aria-hidden="true">'+body+'</svg>';
}
function setDaycares(rows){
  state.dc.list=(rows||[]).map(function(r,i){
    var keys=[dcKey(r.name)].concat((r.alias||[]).map(dcKey));
    return { id:'dc'+i, name:r.name, type:r.type||'', dong:r.dong||'', phone:r.phone||'', address:r.address||'',
             lat:(r.lat==null?null:+r.lat), lng:(r.lng==null?null:+r.lng), approx:!!r.approx, inspectDate:r.inspectDate||null,
             closed:!!r.closed, closedNote:r.closedNote||'', keys:keys,
             zip:r.zip||'', fax:r.fax||'', capacity:(r.capacity==null?null:+r.capacity), current:(r.current==null?null:+r.current),
             shuttle:r.shuttle||'', licensedDate:r.licensedDate||'' };
  });
  state.dc.built=false; state.dc.refit=true;
}
// 점검 상태는 '이 어린이집 이름이 장소에 들어 있는 지도점검 일정'에서 저절로 정해져요
function dcCompute(){
  var t=todayKey();
  // 장소 칸을 쉼표로 나눈 뒤 (주소)를 떼고, 그 조각이 정식 명칭(또는 등록된 별칭)과 정확히 같은지로만 판단해요.
  // (예사랑어린이집처럼 다른 이름 안에 통째로 들어있는 경우까지 걸리지 않도록, 부분포함이 아니라 정확히 같은지만 비교해요.
  //  별칭도 '부분 포함'이 아니라 '완전히 같을 때'만 인정하니, 짧은 별칭이 엉뚱한 곳과 겹칠 위험은 없어요.)
  var ins=[];
  state.events.filter(function(e){ return e.cat==='점검'; }).forEach(function(e){
    // 일시 칸의 시간들을 '/' 기준으로 나눠서, 첫 번째 시간은 첫 번째 어린이집, 두 번째 시간은 두 번째 어린이집…으로 짝지어요.
    // (예: '10:00 / 14:00'). 시간이 아예 없거나 개수가 안 맞으면 시간을 '알 수 없음'으로 두고 이름순으로 정렬해요.
    var afterDate=(e.when||'').replace(/^.*?\)\s*/,'');
    var parts=afterDate.split('/').map(function(x){ var m=x.match(/(\d{1,2}):(\d{2})/); return m?(+m[1])*60+(+m[2]):null; });
    var segs=e.place.split(',').map(function(seg){ return seg.replace(/\([^)]*\)/g,'').trim(); }).filter(Boolean);
    segs.forEach(function(name,i){
      var mins=null;
      if(parts.length===segs.length) mins=parts[i];
      else if(parts.length===1 && segs.length===1) mins=parts[0];
      ins.push({ name:name, e:e, mins:mins });
    });
  });
  state.dc.list.forEach(function(dc){
    // 휴원·폐원인 곳도 점검일이 있으면 그대로 기점검/점검예정으로 세고, 계산 방식은 다른 곳과 같아요.
    var visits={};
    if(dc.inspectDate) visits[dc.inspectDate]={ date:dc.inspectDate, people:null, isAll:false, content:'' };
    ins.forEach(function(x){
      if(x.name!==dc.name && (dc.alias||[]).indexOf(x.name)<0) return;
      x.e.dates.forEach(function(d){ visits[d]={ date:d, people:x.e.people, isAll:x.e.isAll, content:x.e.content, mins:x.mins }; });
    });
    var list=Object.keys(visits).map(function(d){ return visits[d]; }).sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
    var past=list.filter(function(v){ return v.date<=t; }), fut=list.filter(function(v){ return v.date>t; });
    dc._visits=list;
    if(past.length){ dc._st='done'; dc._visit=past[past.length-1]; dc._date=dc._visit.date; }
    else if(fut.length){ dc._st='planned'; dc._visit=fut[0]; dc._date=dc._visit.date; }
    else { dc._st='none'; dc._visit=null; dc._date=null; }
    dc._mins=(dc._visit && dc._visit.mins!=null)?dc._visit.mins:null;
  });
}
function dcMatchesText(x,toks){
  var hay=(x.name+' '+(x.alias||[]).join(' ')+' '+x.type+' '+x.dong+' '+x.address+' '+x.phone).toLowerCase();
  for(var i=0;i<toks.length;i++){ if(hay.indexOf(toks[i])<0) return false; }
  return true;
}
function dcVisible(){
  var d=state.dc, toks=d.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var out=d.list.filter(function(x){
    if(d.filter!=='all' && x._st!==d.filter) return false;
    if(d.type && x.type!==d.type) return false;
    if(d.dong && x.dong!==d.dong) return false;
    return !toks.length || dcMatchesText(x,toks);
  });
  out.sort(function(a,b){
    if(d.sort==='name') return a.name<b.name?-1:1;
    if(d.sort==='date'){
      if(!a._date && !b._date) return a.name<b.name?-1:1;
      if(!a._date) return 1; if(!b._date) return -1;
      if(a._date!==b._date) return a._date<b._date?-1:1;
      // 같은 날이면: 시간을 아는 곳끼리는 이른 시간부터, 시간을 모르는 곳(8/25 이전 기록 등)은 뒤에서 이름순
      var am=a._mins, bm=b._mins;
      if(am!=null && bm!=null && am!==bm) return am-bm;
      if(am!=null && bm==null) return -1;
      if(am==null && bm!=null) return 1;
      return a.name<b.name?-1:1;
    }
    var s=ST_ORDER[a._st]-ST_ORDER[b._st]; return s || (a.name<b.name?-1:1);
  });
  return out;
}
function isoToDot(s){
  var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s||'');
  return m ? (+m[1])+'. '+(+m[2])+'. '+(+m[3])+'.' : (s||'-');
}
function dcCard(dc, withBtn){
  var lbl=ST_LABEL[dc._st];
  var dateTxt = dc._date ? dateLabel(dc._date,true) : (dc._st==='closed' ? (dc.closedNote||'') : '아직 일정이 없어요');

    +'<dt>유형</dt><dd>'+esc(dc.type||'-')+(dc.dong?' · '+esc(dc.dong):'')+'</dd>'
    +'<dt>주소</dt><dd>'+zipAddr+'</dd>'
    +'<dt>전화</dt><dd>'+(dc.phone?esc(dc.phone):'-')+(dc.fax?' · 팩스 '+esc(dc.fax):'')+'</dd>'
    +'<dt>'+(dc._st==='planned'?'예정일':'점검일')+'</dt><dd>'+esc(dateTxt)+'</dd>'
    +(dc.capacity!=null?'<dt>정·현원</dt><dd>'+esc(dc.current)+'/'+esc(dc.capacity)+'명'+(dc.shuttle?' · 통학차량 '+esc(dc.shuttle):'')+'</dd>':'')
    +(dc.licensedDate?'<dt>인가일자</dt><dd>'+esc(isoToDot(dc.licensedDate))+'</dd>':'')
    +'</dl>';
  return '<div class="dcbox st-'+dc._st+'"><span class="dbadge st-'+dc._st+'">'+stShape(dc._st,16)+lbl+'</span>'
    +'<h3>'+esc(dc.name)+'</h3>'+dl
    +(dc.approx?'<div class="warn">※ 위치는 예시예요</div>':'')
    +(withBtn && dc.address ? '<div class="maplinks">지도 앱에서 열기 · <a href="https://map.kakao.com/link/search/'+encodeURIComponent(dc.address)+'" target="_blank" rel="noopener">카카오맵</a> · <a href="https://map.naver.com/p/search/'+encodeURIComponent(dc.address)+'" target="_blank" rel="noopener">네이버지도</a> · <a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(dc.address)+'" target="_blank" rel="noopener">구글지도</a></div>' : '')
    +(withBtn && dc._date ? '<div class="go"><button type="button" data-dc-cal="'+dc._date+'">달력에서 일정 보기</button></div>' : '')+'</div>';
}
function dcBuild(){
  var d=state.dc;
  var types=[];
  d.list.forEach(function(x){ if(x.type && types.indexOf(x.type)<0) types.push(x.type); });
  types.sort(function(a,b){ return typeRank(a)-typeRank(b); });
  var dongs=DONG_ORDER.slice();
  var opt=function(list,ph){ return '<option value="">'+ph+'</option>'+list.map(function(v){ return '<option value="'+esc(v)+'">'+esc(v)+'</option>'; }).join(''); };
  $('#dcview').innerHTML=
    '<div class="card dccard"><div class="dcttl"><h2>어린이집 목록</h2><span class="sum" id="dcSum"></span></div>'
    +'<div class="dcbar" id="dcBar"></div>'
    +'<div class="dcnote" id="dcNote" hidden>※ 아직 위치(위도·경도) 정보가 없어서 지도에 핀이 표시되지 않아요. 목록에서 주소·전화번호는 확인할 수 있어요.</div>'
    +'<div class="dctools" id="dcChips"></div>'
    +'<div class="dctools"><select id="dcType" aria-label="유형">'+opt(types,'유형 전체')+'</select>'
    +'<select id="dcDong" aria-label="행정동">'+opt(dongs,'행정동 전체')+'</select>'
    +'<input id="dcQ" type="search" placeholder="이름·주소·전화 찾기" aria-label="어린이집 찾기" autocomplete="off">'
    +'<span class="dccount" id="dcCount"></span>'
    +'<span class="sp"></span>'

/* ---------- 지도 (캔버스에 직접 그려요) ----------
   Leaflet이나 별도 지도 프로그램 없이, 서귀포지역 확인용으로 쓰던 방식과 똑같이
   OpenStreetMap 타일 이미지를 캔버스에 직접 그려요. 인터넷에서 따로 불러올 프로그램이 없어서,
   그 프로그램 주소가 막히는 문제 자체가 생기지 않아요. */
var MAPT=256;
var DCMAP={ canvas:null, ctx:null, W:0, H:0, dpr:1, center:[33.31,126.56], zoom:10, points:[], dragging:false, moved:false, last:[0,0], hotId:null, pinnedId:null, tileCache:{}, ready:false, everOk:false, pointers:{}, pinching:false, pinchStart:null, pinchZoom0:0, pinchAnchor:null, lastTap:null };

function dcDrawTiles(){

}
// 지도 배경(사진) 후보 서버들이에요. 첫 번째가 막히면 자동으로 다음 걸 시도해요.

var TILE_SOURCES=[
  function(z,x,y){ return 'https://tile.openstreetmap.de/'+z+'/'+x+'/'+y+'.png'; },
  function(z,x,y){ return 'https://tile.openstreetmap.org/'+z+'/'+x+'/'+y+'.png'; },
  function(z,x,y){ return 'https://a.tile.opentopomap.org/'+z+'/'+x+'/'+y+'.png'; }
];
// 한꺼번에 너무 많은 사진을 동시에 요청하면(빠르게 여러 번 확대를 누를 때 등)
// 지도 서버가 '이상한 트래픽'으로 보고 막아버릴 수 있어요. 그래서 한 번에 최대 6장까지만 동시에 받고,
// 나머지는 줄을 서서 순서대로 받도록 했어요.
var TILE_QUEUE=[], TILE_INFLIGHT=0, TILE_MAX_CONCURRENT=6;
function dcFetchTile(z,tx,y,slot){
  TILE_QUEUE.push({ z:z, tx:tx, y:y, slot:slot });

}
function dcPumpTileQueue(){
  while(TILE_INFLIGHT<TILE_MAX_CONCURRENT && TILE_QUEUE.length){
    var job=TILE_QUEUE.shift();
    TILE_INFLIGHT++;
    dcTryTile(job.z,job.tx,job.y,job.slot,0,function(){ TILE_INFLIGHT--; dcPumpTileQueue(); });

function dcTryTile(z,tx,y,slot,i,done){
  if(i>=TILE_SOURCES.length){ slot.bad=true; slot.loading=false; dcMapRedraw(); if(done) done(); return; }
  var url=TILE_SOURCES[i](z,tx,y);

  // 그림이긴 하니 '성공'으로 착각해요. fetch로 받으면 응답이 진짜 정상(200)인지 먼저 확인할 수 있어요.
  fetch(url,{ mode:'cors' }).then(function(res){
    if(!res.ok) throw new Error('http '+res.status);

    img.onload=function(){ slot.el=img; slot.complete=true; slot.loading=false; DCMAP.everOk=true; var n=$('#dcMapNote'); if(n) n.hidden=true; dcMapRedraw(); if(done) done(); };
    img.onerror=function(){ dcTryTile(z,tx,y,slot,i+1,done); };

}
function dcPinPath(ctx,x,y,st,r){

function dcDrawPins(){

    var xy=dcProject(pt.lat,pt.lng), x=xy[0], y=xy[1];
    if(x<-20||x>DCMAP.W+20||y<-20||y>DCMAP.H+20) return;

function dcMapRedraw(){

function dcHitTest(clientX,clientY){
  var r=DCMAP.canvas.getBoundingClientRect(), x=clientX-r.left, y=clientY-r.top;
  var best=null, bd=16;
  DCMAP.points.forEach(function(pt){
    var xy=dcProject(pt.lat,pt.lng), d=Math.hypot(xy[0]-x,xy[1]-y);
    if(d<bd){ bd=d; best=pt; }

function dcShowTip(pt, clientX, clientY, withBtn){
  var tip=$('#dcTip'); if(!tip || !pt) return;

  tip.hidden=false;
  tip.classList.toggle('interactive', !!withBtn);   // 클릭으로 고정된 카드만 버튼·링크가 눌리게 해요
  var card=$('.dcmapcard').getBoundingClientRect();
  var maxH=card.height-16;
  var tw=Math.min(280, card.width-20);
  tip.style.width=tw+'px';
  tip.style.maxHeight=maxH+'px';   // 카드 안에 다 안 들어가면 이 안에서 스크롤해서 볼 수 있어요
  var th=tip.offsetHeight||140;   // 너비를 먼저 정한 뒤에 높이를 재야, 글이 줄바꿈된 실제 높이가 나와요
  var x=clientX-card.left+14, y=clientY-card.top-th-14;
  if(x+tw>card.width-8) x=card.width-tw-8;
  if(x<8) x=8;
  if(y<8) y=8;   // 위로도 자리가 없으면 그냥 맨 위에 붙여서, 아래쪽이 잘리지 않게 해요

function dcHideTip(){ var tip=$('#dcTip'); if(tip){ tip.hidden=true; } }
function dcInitMap(){

  // 이미 같은 캔버스에 연결돼 있으면 다시 손댈 필요 없고, 새 캔버스로 바뀐 경우에만 다시 연결해요.

  dcResizeCanvas(); dcMapRedraw();

  canvas.addEventListener('pointerdown',function(e){
    canvas.setPointerCapture(e.pointerId);

      // 그 지점이 손가락을 움직이는 동안 화면에서 같은 자리에 계속 붙어있도록 만들면 흔들림이 없어요.

      else { if(DCMAP.hotId){ dcHot(DCMAP.hotId,false); DCMAP.hotId=null; dcMapRedraw(); } if(!DCMAP.pinnedId) dcHideTip(); canvas.style.cursor='grab'; }
    }

  $('#dcZin').addEventListener('click',function(){ DCMAP.zoom=dcClampZoom(DCMAP.zoom+1); dcMapRedraw(); });
  $('#dcZout').addEventListener('click',function(){ DCMAP.zoom=dcClampZoom(DCMAP.zoom-1); dcMapRedraw(); });

}
function dcPinchInfo(){

function dcScreenToLatLng(clientXY){

function dcHot(id,on){
  var tr=document.querySelector('#dcBody tr[data-id="'+id+'"]'); if(tr) tr.classList.toggle('hot',on);
}

function dcSyncMap(list){

    .map(function(x){ return { id:x.id, lat:+x.lat, lng:+x.lng, name:x.name, type:x.type, dong:x.dong, phone:x.phone, address:x.address, approx:x.approx, closed:x.closed, closedNote:x.closedNote, inspectDate:x.inspectDate, zip:x.zip, fax:x.fax, capacity:x.capacity, current:x.current, shuttle:x.shuttle, licensedDate:x.licensedDate, _st:x._st, _date:x._date, _visit:x._visit, _visits:x._visits }; });

function whenToTime(w){
  return (w||'').replace(/^\s*\d{4}\.\s*\d{1,2}\.\s*\d{1,2}\.\s*\([일월화수목금토]\)\s*/,'').replace(/^~\s*\d{1,2}\.\s*\d{1,2}\.\s*\([일월화수목금토]\)\s*/,'').trim();
}
function buildWhen(start,end,time){
  var w=dateLabel(start,true);
  if(end && end>start) w+='~'+dateLabel(end,false);
  if(time) w+=' '+time;
  return w;
}
function openEditor(id){

    +'<div class="form">'
    +'<label class="full">제목 (달력에 보이는 이름)<input id="eTitle" value="'+esc(e?e.title:'')+'" placeholder="예: 지도점검(꿈비)"></label>'
    +'<label>날짜<input type="date" id="eStart" value="'+start+'"></label>'

    +'<label>시간 (없으면 비워 두세요)<input id="eTime" value="'+esc(e?whenToTime(e.when):'')+'" placeholder="예: 10:00 또는 10:00~12:00"></label>'
    +'<label>장소<input id="ePlace" value="'+esc(e?e.place:'')+'" placeholder="예: 꿈비어린이집(주소)"></label>'
    +'<label class="full">내용<textarea id="eContent" placeholder="예: 2026년 정기 지도점검(1개소)">'+esc(e?e.content:'')+'</textarea></label>'
    +'</div><div class="err" id="eErr"></div>'
    +'<div class="actions"><button type="button" class="btn" data-close>취소</button><button type="button" class="btn primary" id="eSave" data-id="'+(e?esc(e.id):'')+'">저장</button></div>');

function syncWho(){
  var col=$('#eCol'); if(!col) return;
  var on=col.value===TEAM;
  $('#eWhoWrap').style.opacity=on?'1':'.4';
  dialog.querySelectorAll('input[name="eWho"]').forEach(function(c){ c.disabled=!on; });
}
function saveEditor(id){
  var g=function(s){ return ($(s).value||'').trim(); };
  var title=g('#eTitle'), start=$('#eStart').value, end=$('#eEnd').value, col=$('#eCol').value, time=g('#eTime'), place=g('#ePlace'), content=g('#eContent');
  var who=[]; dialog.querySelectorAll('input[name="eWho"]:checked').forEach(function(c){ who.push(c.value); });
  var err='';
  if(!title) err='제목을 적어 주세요.';
  else if(!start) err='날짜를 골라 주세요.';
  else if(end && end<start) err='끝나는 날이 시작하는 날보다 빨라요.';
  if(err){ $('#eErr').textContent=err; return; }
  var ev={ id:id||'', title:title, col:col, hasWho:(col===TEAM && who.length>0),
           people:(col===TEAM)?(who.length?who:NAMES.slice()):[col],
           when:buildWhen(start,end,time), place:place, content:content,
           dates:rangeDates(start,(end&&end>start)?end:start) };
  var btn=$('#eSave'); btn.disabled=true; btn.textContent='저장 중…'; $('#eErr').textContent='';
  (id?Store.update(ev):Store.add(ev)).then(function(saved){
    saved=finalize(saved);
    if(id){ state.events=state.events.map(function(x){ return x.id===id?saved:x; }); }
    else { state.events.push(saved); }
    byId={}; state.events.forEach(function(x){ byId[x.id]=x; });
    sortEvents(); state.sig=signature(state.events);
    closeDialog(); state.filter='all';
    selectDate(start, saved.id);
    toast(Store.mode==='online' ? '저장했어요. 팀원들에게도 바로 보여요.' : '체험 화면이라 이 화면에서만 바뀌었어요.');
  }).catch(function(e){
    if(e && e.auth){ closeDialog(); forceLogin(errMsg(e)); return; }
    var b=$('#eSave'); if(b){ b.disabled=false; b.textContent='저장'; }
    var m=$('#eErr'); if(m) m.textContent=errMsg(e);
    if(e && e.gone){ refreshNow(); }
  });
}
function confirmDelete(id){
  var e=byId[id]; if(!e) return;
  openDialog('<h2>일정을 삭제할까요?</h2><p class="lead">“'+esc(e.title)+'” · '+esc(e.when)+'</p><div class="err" id="dErr"></div><div class="actions"><button type="button" class="btn" data-close>취소</button><button type="button" class="btn danger" data-del="'+esc(id)+'">삭제</button></div>');

function doDelete(id, btn){
  btn.disabled=true; btn.textContent='삭제 중…';

    state.events=state.events.filter(function(e){ return e.id!==id; }); delete byId[id];

  }).catch(function(e){
    if(e && e.auth){ closeDialog(); forceLogin(errMsg(e)); return; }

var pollTimer=null;

function boot(){
  $('#login').hidden=true; showAcct();
  $('#view').innerHTML='<div class="empty" style="padding:60px 8px">일정을 불러오는 중이에요…</div>';
  return Store.load().then(function(rows){
    setEvents(rows); state.booted=true; pickInitial();
    return Store.loadDaycares().then(setDaycares).catch(function(e){ if(e && e.auth) throw e; }).then(function(){ renderAll(); startPolling(); });
  }).catch(function(e){
    if(e && e.auth){ forceLogin(errMsg(e)); return; }
    $('#view').innerHTML='<div class="fatal"><b>일정을 불러오지 못했어요.</b><span>'+esc(errMsg(e))+'</span><button type="button" class="btn primary" id="retry">다시 불러오기</button></div>';
  });
}
function refreshNow(){
  if(Store.mode!=='online' || !state.booted) return Promise.resolve();
  return Store.load().then(function(rows){
    var next=rows.map(function(r){ return finalize({ id:r.id, title:r.title, col:r.col, people:r.people, hasWho:!!r.hasWho, when:r.when||'', place:r.place||'', content:r.content||'', dates:(r.dates||[]).slice().sort() }); });
    if(signature(next)!==state.sig){ setEvents(rows); renderAll(); }
  }).catch(function(e){ if(e && e.auth) forceLogin(errMsg(e)); });
}
function startPolling(){

function selectDate(k, focusId){

function shiftMonth(n){
  var d=new Date(state.year,state.month+n,1);
  if(d.getFullYear()<MIN_YEAR || (d.getFullYear()===MIN_YEAR && d.getMonth()<MIN_MONTH)) return;
  state.year=d.getFullYear(); state.month=d.getMonth();
  var t=parseKey(todayKey());
  if(t.y===state.year && t.m-1===state.month){ state.selected=todayKey(); }
  else {
    var pre=state.year+'-'+pad(state.month+1)+'-', first=null;
    state.events.forEach(function(e){ e.dates.forEach(function(dk){ if(dk.indexOf(pre)===0 && (first===null||dk<first)) first=dk; }); });
    state.selected=first||ymd(state.year,state.month+1,1);
  }
  renderAll();
}

(function(){
  var sx=0, sy=0, tracking=false;
  var view=$('#view');
  view.addEventListener('touchstart',function(e){
    if(state.view!=='cal' || e.touches.length!==1) { tracking=false; return; }
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; tracking=true;
  },{ passive:true });
  view.addEventListener('touchend',function(e){
    if(!tracking) return; tracking=false;
    var t=e.changedTouches[0]; if(!t) return;
    var dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) shiftMonth(dx<0?1:-1);
  },{ passive:true });
})();

  { id:'vibrant', name:'화사한', sw:['#FFF5F1','#FF9E78','#E9FBF3'] }
];
var ORDERABLE=[ { id:'cal', label:'달력' }, { id:'list', label:'일정 목록' }, { id:'dc', label:'어린이집 목록' } ];
var DEFAULT_ORDER=ORDERABLE.map(function(o){ return o.id; });

function loadTheme(){ try{ return localStorage.getItem(THEME_KEY)||'basic'; }catch(e){ return 'basic'; } }
function applyTheme(id, persist){
  document.documentElement.setAttribute('data-theme', id==='basic'?'':id);
  if(persist){ try{ localStorage.setItem(THEME_KEY, id); }catch(e){} }
}
function loadOrder(){
  try{
    var raw=JSON.parse(localStorage.getItem(ORDER_KEY)||'null');
    if(raw && raw.length===3 && ORDERABLE.every(function(o){ return raw.indexOf(o.id)>=0; })) return raw;
  }catch(e){}
  return DEFAULT_ORDER.slice();
}
function applyOrder(order, persist){
  var nav=document.querySelector('.nav'), settingsBtn=nav.querySelector('[data-view="settings"]');
  order.forEach(function(id){ nav.insertBefore(nav.querySelector('[data-view="'+id+'"]'), settingsBtn); });
  if(persist){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
}

// 설정 화면에서 고르는 동안은 '미리보기'만 하고, 저장을 눌러야 실제로 확정돼요.
// 저장하지 않고 다른 화면으로 나가면 원래(마지막으로 저장된) 모습으로 되돌아가요.
var SET_DRAFT_THEME=null, SET_DRAFT_ORDER=null, SET_DIRTY=false;
function settingsRevertIfDirty(){
  if(!SET_DIRTY) return;
  applyTheme(loadTheme(), false);
  applyOrder(loadOrder(), false);
  SET_DIRTY=false; SET_DRAFT_THEME=null; SET_DRAFT_ORDER=null;
}

function csvCell(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCsv(filename, rows){
  var text='\uFEFF'+rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
  var blob=new Blob([text],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
}
function exportEventsCsv(){
  var rows=[['날짜','제목','분류','담당(출장자)','장소','내용']];
  state.events.forEach(function(e){
    var who=e.isAll?'팀 전체 ('+e.people.join(', ')+')':e.people.join(', ');
    e.dates.forEach(function(d){ rows.push([d, e.title, e.cat, who, e.place, e.content]); });
  });
  downloadCsv('어린이집지도팀_전체일정.csv', rows);
}
function exportDaycaresCsv(){
  dcCompute();
  var rows=[['어린이집명','유형','행정동','주소','전화','팩스','정원','현원','통학차량','인가일자','점검상태','마지막(예정)점검일','비고']];
  state.dc.list.forEach(function(x){
    rows.push([x.name, x.type, x.dong, x.address, x.phone, x.fax, x.capacity, x.current, x.shuttle, x.licensedDate, ST_LABEL[x._st], x._date||'', x.closed?(x.closedNote||'미운영'):'']);
  });
  downloadCsv('어린이집지도팀_어린이집목록.csv', rows);
}
function renderSettings(){
  if(SET_DRAFT_THEME==null) SET_DRAFT_THEME=loadTheme();
  if(SET_DRAFT_ORDER==null) SET_DRAFT_ORDER=loadOrder();
  var theme=SET_DRAFT_THEME, order=SET_DRAFT_ORDER;
  var acctCard = Store.mode==='online'
    ? '<div class="card setcard"><h2>내 계정</h2><div class="acctrow"><div class="name">어린이집지도팀</div><button type="button" class="btn" id="setLogout">로그아웃</button></div></div>'
    : '<div class="card setcard"><h2>내 계정</h2><p class="acctnote">체험 화면이라 로그인 정보가 없어요. Supabase에 연결된 실제 화면에서는 여기에 계정 이름과 로그아웃 버튼이 나와요.</p></div>';
  $('#settingsview').innerHTML = acctCard
    +'<div class="card setcard"><h2>화면 개인화</h2><p class="sub">이 컴퓨터(브라우저)에만 적용돼요. 다른 팀원 화면에는 영향이 없어요. 아래에서 골라본 뒤 <b>저장</b>을 눌러야 확정돼요.</p>'
    +'<div class="persrow">'
    +'<div class="col"><div class="setsub">테마</div><div class="themepicks">'+THEMES.map(function(t){
      return '<button type="button" class="pick'+(t.id===theme?' on':'')+'" data-set-theme="'+t.id+'">'
        +'<span class="swatch">'+t.sw.map(function(c){ return '<span style="background:'+c+'"></span>'; }).join('')+'</span>'
        +'<span class="pname">'+esc(t.name)+'</span>'
        +(t.id===theme?'<span class="check">✓</span>':'')+'</button>';
    }).join('')+'</div></div>'
    +'<div class="col"><div class="setsub">페이지 순서</div><div class="orderlist" id="orderList">'+order.map(function(id,i){
      var o=ORDERABLE.filter(function(x){ return x.id===id; })[0];
      return '<div class="orow" data-id="'+id+'"><span class="num">'+(i+1)+'</span><span class="lbl">'+esc(o.label)+'</span>'
        +'<span class="arrows"><button type="button" data-order-up="'+id+'"'+(i===0?' disabled':'')+'>▲</button>'
        +'<button type="button" data-order-down="'+id+'"'+(i===order.length-1?' disabled':'')+'>▼</button></span></div>';
    }).join('')+'</div></div>'
    +'</div>'
    +'<div class="persactions"><span class="hint" id="setHint"></span><button type="button" class="btn" id="setReset">기본값으로 초기화</button><button type="button" class="btn primary" id="setSave">저장</button></div>'
    +'</div>'
    +'<div class="card setcard"><h2>자료 내보내기</h2><p class="sub">지금 자료를 표(CSV) 파일로 내려받아요. 엑셀로 바로 열려요.</p>'
    +'<div class="exportgrid">'
    +'<div class="exportrow"><div><div class="t">전체 일정</div><div class="d">지금까지 등록된 모든 일정 · 총 '+state.events.length+'건</div></div>'
    +'<button type="button" class="btn primary" id="expEvents"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg>다운로드</button></div>'
    +'<div class="exportrow"><div><div class="t">어린이집 목록</div><div class="d">등록된 어린이집 전체 현황 · 총 '+state.dc.list.length+'곳</div></div>'
    +'<button type="button" class="btn primary" id="expDaycares"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg>다운로드</button></div>'
    +'</div></div>';
  if(Store.mode==='online') $('#setLogout').addEventListener('click',function(){ forceLogin('로그아웃했어요.'); });
  $('#expEvents').addEventListener('click', exportEventsCsv);
  $('#expDaycares').addEventListener('click', exportDaycaresCsv);
  $('#setSave').addEventListener('click',function(){
    applyTheme(SET_DRAFT_THEME, true); applyOrder(SET_DRAFT_ORDER, true);
    SET_DIRTY=false;
    $('#setHint').textContent='저장했어요.';
    setTimeout(function(){ var h=$('#setHint'); if(h) h.textContent=''; },2000);
  });
  $('#setReset').addEventListener('click',function(){
    SET_DRAFT_THEME='basic'; SET_DRAFT_ORDER=DEFAULT_ORDER.slice();
    SET_DIRTY=true; applyTheme(SET_DRAFT_THEME, false); applyOrder(SET_DRAFT_ORDER, false);
    renderSettings();
    $('#setHint').textContent='기본값으로 되돌렸어요. 저장을 눌러야 확정돼요.';
  });
}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-set-theme]');
  if(t){ SET_DRAFT_THEME=t.getAttribute('data-set-theme'); SET_DIRTY=true; applyTheme(SET_DRAFT_THEME,false); renderSettings(); return; }
  var up=ev.target.closest('[data-order-up]'), down=ev.target.closest('[data-order-down]');
  if(up || down){
    var id=(up||down).getAttribute(up?'data-order-up':'data-order-down');
    var order=SET_DRAFT_ORDER.slice(), i=order.indexOf(id), j=up?i-1:i+1;
    if(j<0||j>=order.length) return;
    var tmp=order[i]; order[i]=order[j]; order[j]=tmp;
    SET_DRAFT_ORDER=order; SET_DIRTY=true; applyOrder(order,false); renderSettings();
  }
});

/* ================== 시작 ================== */
drawScenes();
applyTheme(loadTheme(), true);
applyOrder(loadOrder(), true);
if(Store.mode==='online'){
  if(Store.hasSession()) boot(); else showLogin();
} else {
  $('#notice').hidden=false;
  Store.load().then(function(rows){ setEvents(rows); pickInitial(); return Store.loadDaycares(); }).then(function(dcs){ setDaycares(dcs); renderAll(); });
}
})();
</script>
</body>
</html>
